<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a2030"/>
    <stop offset="1" stop-color="#232b3d"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a3226"/>
    <stop offset="1" stop-color="#262019"/>
  </linearGradient>
  <radialGradient id="glowFloor" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowCore" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#a5f3fc"/>
    <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lensGrad" cx="0.42" cy="0.38" r="0.75">
    <stop offset="0" stop-color="#cffafe"/>
    <stop offset="0.35" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#0e7490"/>
  </radialGradient>
  <radialGradient id="ringGrad" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#0e7490" stop-opacity="0"/>
    <stop offset="0.8" stop-color="#67e8f9" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/>
    <stop offset="0.55" stop-color="#dbe2ea"/>
    <stop offset="1" stop-color="#9fb0bf"/>
  </linearGradient>
  <linearGradient id="ceramicShaded" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e2e8f0"/>
    <stop offset="1" stop-color="#7e8fa0"/>
  </linearGradient>
  <linearGradient id="carbon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2b2f36"/>
    <stop offset="1" stop-color="#14161a"/>
  </linearGradient>
  <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#f9a8d4" stop-opacity="0.5"/>
  </linearGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.5"/>
  </filter>
</defs>

