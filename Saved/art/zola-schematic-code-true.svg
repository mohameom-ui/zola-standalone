    <circle r="30" fill="none" stroke="#0e7490" stroke-width="3"/>
    <circle r="22" fill="none" stroke="#0891b2" stroke-width="1.2" opacity="0.6"/>
    <g stroke="#4b5563" stroke-width="3">
      <line x1="-19" y1="0" x2="19" y2="0"/><line x1="0" y1="-19" x2="0" y2="19"/>
      <line x1="-13" y1="-13" x2="13" y2="13"/><line x1="-13" y1="13" x2="13" y2="-13"/>
    </g>
    <circle r="5" fill="#111418"/>
