<line x1="560" y1="884" x2="840" y2="884" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
<text x="770" y="916" class="tiny">the boots: the support polygon —</text>
<text x="770" y="928" class="tiny">the sit lesson lives here</text>

<!-- ======== the callouts (left column) ======== -->
<g>
  <circle cx="700" cy="164" r="24" fill="none" stroke="#0e7490" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="678" y1="152" x2="470" y2="120" class="lead"/>
  <text x="300" y="112" class="lbl">SINGLE LENS EYE — the canon's only face</text>
  <text x="300" y="126" class="sub">no drone head, no LED array: one monocular sensor, temple IMUs</text>

  <line x1="560" y1="230" x2="420" y2="216" class="leadc"/>
  <text x="90" y="204" class="lbl">4× DUCTED COLLAR ROTORS</text>
  <text x="90" y="218" class="sub">neck-mounted, 2 per side — collar_*_thruster:</text>
  <text x="90" y="231" class="sub">ducted fans, real bodies in the physics profile —</text>
  <text x="90" y="244" class="sub">NOT exposed props, NOT a head-mounted frame</text>

  <line x1="640" y1="330" x2="452" y2="330" class="leadc"/>
  <text x="150" y="324" class="lbl">ESP32-S3 FLIGHT CONTROLLER</text>
  <text x="150" y="337" class="sub">FreeRTOS dual-core: flight 500 Hz / telemetry 100 Hz</text>
  <text x="150" y="350" class="sub">the 36-byte canon, USB + Wi-Fi</text>

  <line x1="660" y1="392" x2="452" y2="430" class="lead"/>
  <text x="150" y="438" class="lbl">MPU-9250 IMU + BMP280 + HMC5883L</text>
  <text x="150" y="451" class="sub">SPI burst + I2C 8/9 — Madgwick feeds the cascade</text>

  <line x1="780" y1="340" x2="920" y2="330" class="lead"/>
  <text x="928" y="324" class="lbl">CORE STATUS LIGHT</text>
  <text x="928" y="337" class="sub">the canon's chest indicator</text>

  <line x1="806" y1="346" x2="920" y2="392" class="leadc"/>
  <text x="900" y="392" class="lbl">3S 1300 mAh BATTERY TRAY</text>
  <text x="900" y="405" class="sub">battery_tray_3s1300 — NOT 4500 mAh;</text>
  <text x="900" y="418" class="sub">pre-arm demands ≥ 11.1 V</text>

  <line x1="800" y1="390" x2="920" y2="452" class="lead"/>
  <text x="880" y="470" class="lbl">RASPBERRY PI 5 — THE BRAIN</text>
  <text x="880" y="483" class="sub">pi5_standoff_frame: Ollama + the panel —</text>
  <text x="880" y="496" class="sub">the FC obeys the brain</text>

  <line x1="610" y1="470" x2="440" y2="540" class="lead"/>
  <text x="120" y="548" class="lbl">22 ARM/HAND JOINTS · 5-FINGER HAND</text>
  <text x="120" y="561" class="sub">the hands learned 598/600 pose control (hands_v1)</text>

  <line x1="660" y1="600" x2="450" y2="640" class="lead"/>
  <text x="120" y="648" class="lbl">12 LEG JOINTS · THE CASCADE</text>
  <text x="120" y="661" class="sub">angle loop → rate PID (Kp 1.2/Ki .05/Kd .03) →</text>
  <text x="120" y="674" class="sub">the QuadX mixer → DShot600 ×4 (RMT, 600 kbit/s)</text>

  <line x1="672" y1="856" x2="480" y2="880" class="lead"/>
  <text x="150" y="886" class="lbl">BOOTS + THE SIT (knee 0.55)</text>
  <text x="150" y="899" class="sub">591/600 episodes held — the pose the physics allows</text>
</g>

<!-- ======== the right panel: the code facts ======== -->
<g>
  <rect x="1120" y="90" width="352" height="360" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="1120" y="90" width="352" height="26" fill="#1f2937"/>
  <text x="1130" y="108" font-family="Arial" font-size="12" font-weight="bold" fill="#f8f5ec">WHAT THE CODE SAYS (the draft got these wrong)</text>
  <g font-family="Arial" font-size="11" fill="#1f2937">
    <text x="1132" y="140">✗ draft: TOTAL HEIGHT 45 cm</text>
    <text x="1132" y="155" font-weight="bold" fill="#0e7490">✓ code: 1759 mm (full_height_mm, the print manifest)</text>
    <text x="1132" y="184">✗ draft: drone head with exposed props</text>
    <text x="1132" y="199" font-weight="bold" fill="#0e7490">✓ code: human head; 4 DUCTED collar fans, neck mount</text>
    <text x="1132" y="228">✗ draft: 4500 mAh battery</text>
    <text x="1132" y="243" font-weight="bold" fill="#0e7490">✓ code: 3S 1300 mAh (battery_tray_3s1300)</text>
    <text x="1132" y="272">✗ draft: "3F/5F freedom" joints</text>
    <text x="1132" y="287" font-weight="bold" fill="#0e7490">✓ code: 41 joints total; 34 in the RL action space</text>
    <text x="1132" y="300" font-weight="bold" fill="#0e7490">(22 arm/hand + 12 leg) — the profile is the count</text>
    <text x="1132" y="329">✗ draft: "✓ VALIDATED" stamps</text>
    <text x="1132" y="344" font-weight="bold" fill="#b91c1c">✓ code: hardware_calibrated: FALSE —</text>
    <text x="1132" y="357" font-weight="bold" fill="#b91c1c">every gain is assumed until the bench (B-01..B-13)</text>
  </g>
</g>

<!-- the swarm + OTA strip -->
<g>
  <rect x="1120" y="470" width="352" height="150" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="1120" y="470" width="352" height="24" fill="#0e7490"/>
  <text x="1130" y="487" font-family="Arial" font-size="12" font-weight="bold" fill="#f8f5ec">ALIVE SUBSYSTEMS (all mirrored-tested: 122 assertions)</text>
  <g font-family="Arial" font-size="10.5" fill="#1f2937">
    <text x="1132" y="514">VISION: PMW3901 flow × VL53L1X ToF = GPS-denied hold</text>
    <text x="1132" y="532">OBSTACLES: OAK-D frames → the 0.7 m emergency brake</text>
    <text x="1132" y="550">SWARM: ESP-NOW 50 Hz, AES-128, lowest-live-id leads</text>
    <text x="1132" y="568">POWER: INA226 + the sag limiter + the 85°C thermal brake</text>
    <text x="1132" y="586">BLACKBOX: the 8 MB ring + event tags + the FFT tuning loop</text>
    <text x="1132" y="604">OTA: dual-bank, ED25519-signed, the 10 s rollback gate</text>
  </g>
</g>

<!-- the boot-state stamp -->
<g>
  <rect x="1120" y="648" width="352" height="72" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="1296" y="676" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#b91c1c">BOOT STATE: DISARMED</text>
  <text x="1296" y="694" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f1d1d">motors idle until the 0xA5 interlock arm —</text>
  <text x="1296" y="708" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f1d1d">the pre-arm gate demands level ±3.5°, bias fresh, ≥ 11.1 V</text>
</g>

<!-- the confirmed stamp -->
<g transform="rotate(-6 1080 880)">
  <rect x="990" y="856" width="180" height="48" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <text x="1080" y="878" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1f2937" letter-spacing="1">CONFIRMED</text>
  <text x="1080" y="894" text-anchor="middle" font-family="Arial" font-size="11" fill="#1f2937" letter-spacing="1">AGAINST THE CODE</text>
</g>
<text x="700" y="962" text-anchor="middle" class="tiny">compiled clean on the ESP32-S3 toolchain · math mirror 122/122 · hardware_calibrated: false — the bench campaign (B-01..B-13) is next</text>
</svg>
