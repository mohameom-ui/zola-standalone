; Project Zola Flight Controller V2 — ESP32-S3, FreeRTOS (flight on core 1 @ 500 Hz,
; telemetry on core 0 @ 100 Hz), SPI-burst MPU-9250, Madgwick AHRS, PID, DShot600.
; Source of truth: zola_engine.cpp (supersedes zola_flight.cpp). Math referee:
; python Scripts/firmware_math_check.py — run it BEFORE flashing.
; Build:  pio run -e zola_fc     Flash: pio run -e zola_fc -t upload     Monitor: pio device monitor -b 921600

[env:zola_fc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    ; the firmware is self-contained: Wire + esp32-hal-rmt ship with the
    ; arduino-esp32 core — no third-party flight code, every line auditable
