; Project Zola Flight Controller — ESP32-S3 (the FULL stack, v6 tiers):
; FreeRTOS dual-core (flight @ 500 Hz on core 1, telemetry @ 100 Hz on core 0),
; SPI-burst MPU-9250 + Madgwick AHRS + the PID cascade + the QuadX mixer,
; DShot600 via RMT, USB+Wi-Fi telemetry, the command/failsafe canon, GPS
; navigation, the vision stack, the swarm mesh, the blackbox, the PDB, and
; the cryptographic OTA.
; Source of truth: zola_engine.cpp. Math referee: Scripts/firmware_math_check.py
; — run it BEFORE flashing.
; Build:  pio run -e zola_fc     Flash: pio run -e zola_fc -t upload
; Monitor: pio device monitor -b 921600

[platformio]
; the sources live FLAT in this folder (zola_engine.cpp is the entry) —
; the default src/ layout would hide them from the build
src_dir = .

[env:zola_fc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
board_build.partitions = partitions_zola.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
; lib_deps intentionally EMPTY: Wire, SPI, esp32-hal-rmt, Update, WiFi and
; ESP-NOW ship with the arduino-esp32 core — no third-party flight code,
; every line auditable
